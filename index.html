<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Кейс-задача №2</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="container">
    <h2>Введите дату рождения</h2>

    <div class="inputs">
        <input type="number" id="day" placeholder="День" min="1" max="31">
        <input type="number" id="month" placeholder="Месяц" min="1" max="12">
        <input type="number" id="year" placeholder="Год" min="1900">
    </div>

    <div class="buttons">
        <button onclick="showDate()">Показать дату</button>
        <button onclick="getWeekDay()">День недели</button>
        <button onclick="isLeapYear()">Високосный год?</button>
        <button onclick="getAge()">Возраст</button>
        <button onclick="printStarsDate()">В консоль (*)</button>
    </div>

    <div id="result"></div>
</div>

<script src="app.js" defer></script>

</body>
</html>
